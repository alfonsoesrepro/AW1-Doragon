name: Doragon · CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests unitarios (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar que los JSON sean válidos
        run: for f in src/data/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done

      - name: Ejecutar tests
        run: node --test

  deploy:
    name: Despliegue a Vercel (producción)
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Avisar si faltan los secretos
        if: env.VERCEL_TOKEN == ''
        run: echo "::warning::Faltan los secretos VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID; se omite el despliegue."

      - name: Desplegar
        if: env.VERCEL_TOKEN != ''
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
